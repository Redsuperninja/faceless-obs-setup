<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Goal</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; padding: 0 14px;
         font-family: Georgia, "Cambria Math", "Segoe UI Symbol", serif; color: #F4F1EA; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
         font-size: 17px; font-weight: bold; text-shadow: 0 2px 3px #000; }
  #label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #count { color: var(--b, #F5921E); white-space: nowrap; }
  .track { margin-top: 8px; height: 18px; background: #05060a; border: 1px solid var(--c, #7E8496); position: relative; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--c, #7E8496), var(--a, #D5D9E3) 45%, var(--b, #F5921E));
          transition: width 1.2s ease; }
</style>
</head>
<body>
<div class="row"><span id="label"></span><span id="count"></span></div>
<div class="track"><div id="fill"></div></div>
<script>
  const root = document.documentElement.style;
  fetch("/style.json").then(r => r.json()).then(s => {
    root.setProperty("--a", s.accent || "#D5D9E3"); root.setProperty("--b", s.accent2 || "#F5921E"); root.setProperty("--c", s.accent3 || "#7E8496");
  }).catch(() => {});
  async function refresh() {
    try {
      const g = await (await fetch("/goal.json", { cache: "no-store" })).json();
      document.getElementById("label").textContent = g.label;      // textContent, never HTML
      document.getElementById("count").textContent = g.current + " / " + g.target;
      document.getElementById("fill").style.width = Math.min(100, Math.max(0, 100 * g.current / Math.max(1, g.target))) + "%";
    } catch (e) { /* hub not running yet; try again */ }
  }
  refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
